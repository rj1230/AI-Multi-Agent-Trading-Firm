[project]
name = "ai-multi-agent-trading-firm"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "rj1230", email = "raj418060@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain==1.3.14",
    "langchain-anthropic==1.5.4",
    "langchain-classic==1.0.8",
    "langchain-community==0.4.2",
    "langchain-core==1.6.0",
    "langchain-groq==1.1.3",
    "langchain-mistralai==1.1.6",
    "langchain-ollama==1.1.0",
    "langchain-openai==1.4.2",
    "langchain-protocol==0.0.18",
    "langchain-tavily==0.2.18",
    "langchain-text-splitters==1.1.2",
    "nemoguardrails>=0.24.1",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
    "pydantic>=2.13,<3",
    "streamlit>=1.63.0",
]

[project.scripts]
ai-multi-agent-trading-firm = "ai_multi_agent_trading_firm:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]
